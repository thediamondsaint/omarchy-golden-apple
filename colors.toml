# Golden Apple — light gold on warm black.
#
# The gold is champagne rather than brass: #e8c77d carries the accent, the borders
# and the selections, and every surface is warmed a few degrees so nothing reads
# cold beside it. The ANSI colours lean warm for the same reason — the blue is a
# dusty slate so the gold keeps the room.
mode = "dark"

accent = "#e8c77d"             # light gold
selection = "#4a3c1f"          # gold at reading strength behind text
muted = "#6b5d42"              # terminal "bright black"

background = "#12100b"         # warm near-black
dark_background = "#0d0b07"
darker_background = "#080704"
lighter_background = "#211b12"  # elevated cards

foreground = "#f5efe0"          # warm white
dark_foreground = "#a2957a"     # tertiary text, dimmed icons
light_foreground = "#e8dfc9"
bright_foreground = "#fffaf0"

red = "#e5645a"
yellow = "#f0c752"
orange = "#e89b3c"
green = "#a8c06a"
cyan = "#8fbfae"
blue = "#8aa9c9"
magenta = "#c99ac0"
brown = "#a9793f"

bright_red = "#f0827a"
bright_yellow = "#ffdc7a"
bright_green = "#c2d98a"
bright_cyan = "#a9d6c8"
bright_blue = "#a9c3dd"
bright_magenta = "#ddb4d6"
