# iOS — Apple's system colors, dark mode.
# Values are Apple's published UIColor systemColors (dark) and the label/gray
# ramps, so anything themed from here lands on the same palette as an iPhone.
mode = "dark"

accent = "#0a84ff"            # systemBlue (dark)
selection = "#1c4a80"         # systemBlue at reading strength behind text
muted = "#48484a"             # systemGray4 (dark) — terminal "bright black"

background = "#000000"        # iOS dark base
dark_background = "#000000"
darker_background = "#000000"
lighter_background = "#1c1c1e" # systemGray6 (dark) — elevated cards

foreground = "#ffffff"         # label
dark_foreground = "#8e8e93"    # systemGray — tertiary text, dimmed icons
light_foreground = "#ebebf5"   # secondaryLabel
bright_foreground = "#ffffff"

red = "#ff453a"                # systemRed
yellow = "#ffd60a"             # systemYellow
orange = "#ff9f0a"             # systemOrange
green = "#30d158"              # systemGreen
cyan = "#64d2ff"               # systemCyan
blue = "#0a84ff"               # systemBlue
magenta = "#bf5af2"            # systemPurple
brown = "#ac8e68"              # systemBrown

bright_red = "#ff6961"
bright_yellow = "#ffe066"
bright_green = "#5ce88a"
bright_cyan = "#8ee0ff"
bright_blue = "#4ca6ff"
bright_magenta = "#d08cff"
