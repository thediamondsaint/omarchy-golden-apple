# Golden Apple — Omarchy shell surfaces.
#
# Every surface here is translucent and tinted warm; hyprland.lua blurs those
# layers, and the two together are the gold glass. The tint lives in the surface
# colour (#1c1710 — black with gold in it), not in the blur, which only carries
# through whatever is behind the window.
#
# Corner radius and gaps are not set here: the shell mirrors Hyprland's
# `decoration:rounding`, which this theme's hyprland.lua sets to 14.

[bar]
background       = "#14110a"
background-alpha = 0.46
text             = "#f5efe0"
# Modules calling attention to themselves (recording, alerts, updates).
active           = "#e5645a"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 30

[hyprland]
# Matches the window border gradient from hyprland.lua.
active-border            = "rgba(e8c77dff) rgba(c79a3aff) 45deg"
active-border-foreground = "#e8c77d"

[controls]
# Filled chips rather than outlined boxes: the fill carries the state, in gold.
normal-color        = "#f5efe0"
normal-fill-alpha   = 0.08
normal-border       = "#e8c77d"
normal-border-width = 0
normal-border-alpha = 0.0

hover-cursor-color        = "#e8c77d"
hover-cursor-fill-alpha   = 0.18
hover-cursor-border       = "#e8c77d"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#e8c77d"
focus-fill-alpha   = 0.20
focus-border       = "#e8c77d"
focus-border-width = 1
focus-border-alpha = 0.6

selected-color        = "#e8c77d"
selected-fill-alpha   = 0.32
selected-border       = "#e8c77d"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.28
selection-fill-alpha = 0.35

[spacing]
scale = 1.08
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#1c1710"
background-alpha = 0.62
text             = "#f5efe0"
# A hairline of gold instead of a hard outline.
border           = "#e8c77d"
border-alpha     = 0.22
border-width     = 1

[tooltip]
background       = "#1c1710"
background-alpha = 0.74
text             = "#f5efe0"
border           = "#e8c77d"
border-alpha     = 0.22

[notifications]
background       = "#1c1710"
background-alpha = 0.66
text             = "#f5efe0"
border           = "#e8c77d"
border-alpha     = 0.24
border-width     = 1
countdown        = "#e8c77d"

[launcher]
background                = "#1c1710"
background-alpha          = 0.62
text                      = "#f5efe0"
border                    = "#e8c77d"
border-alpha              = 0.22
scrim                     = "#0d0b07"
scrim-alpha               = 0.4
# The selected row is a solid gold pill with dark text, the way iOS fills a row.
selected-background       = "#e8c77d"
selected-background-alpha = 0.95
selected-text             = "#14110a"
selected-border           = "#e8c77d"
selected-border-alpha     = 0.0

[menu]
background                = "#1c1710"
background-alpha          = 0.62
text                      = "#f5efe0"
border                    = "#e8c77d"
border-alpha              = 0.22
scrim                     = "#0d0b07"
scrim-alpha               = 0.4
selected-background       = "#e8c77d"
selected-background-alpha = 0.95
selected-text             = "#14110a"
selected-border           = "#e8c77d"
selected-border-alpha     = 0.0

[polkit]
background       = "#1c1710"
background-alpha = 0.8
text             = "#f5efe0"
text-error       = "#e5645a"
border           = "#e8c77d"
border-error     = "#e5645a"
border-alpha     = 0.24
scrim            = "#0d0b07"
scrim-alpha      = 0.5
accent           = "#e8c77d"

[lock]
background       = "#1c1710"
background-alpha = 0.5
text             = "#f5efe0"
placeholder      = "#a2957a"
text-error       = "#e5645a"
border           = "#e8c77d"
border-active    = "#e8c77d"
border-error     = "#e5645a"
border-alpha     = 0.3
selection        = "#e8c77d"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#0d0b07"
scrim-alpha             = 0.5
text                    = "#f5efe0"
selected-border         = "#e8c77d"
selected-border-alpha   = 1.0
unselected-border       = "#f5efe0"
unselected-border-alpha = 0.22
