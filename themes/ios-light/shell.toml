# iOS Light — Omarchy shell surfaces.
#
# Same construction as the dark variant: translucent surfaces here, the blur in
# themes/ios-light/hyprland.lua. Corner radius and gaps come from Hyprland's
# `decoration:rounding`, which that file sets to 14.

[bar]
background       = "#ffffff"
background-alpha = 0.62
text             = "#1c1c1e"
active           = "#d70015"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 30

[hyprland]
active-border            = "rgba(007affff) rgba(5ac8faff) 45deg"
active-border-foreground = "#1c1c1e"

[controls]
normal-color        = "#1c1c1e"
normal-fill-alpha   = 0.06
normal-border       = "#1c1c1e"
normal-border-width = 0
normal-border-alpha = 0.0

hover-cursor-color        = "#1c1c1e"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#1c1c1e"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#007aff"
focus-fill-alpha   = 0.14
focus-border       = "#007aff"
focus-border-width = 1
focus-border-alpha = 0.55

selected-color        = "#007aff"
selected-fill-alpha   = 0.22
selected-border       = "#007aff"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.20
selection-fill-alpha = 0.30

[spacing]
scale = 1.08
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#ffffff"
background-alpha = 0.78
text             = "#1c1c1e"
border           = "#000000"
border-alpha     = 0.10
border-width     = 1

[tooltip]
background       = "#ffffff"
background-alpha = 0.88
text             = "#1c1c1e"
border           = "#000000"
border-alpha     = 0.10

[notifications]
background       = "#ffffff"
background-alpha = 0.8
text             = "#1c1c1e"
border           = "#000000"
border-alpha     = 0.10
border-width     = 1
countdown        = "#007aff"

[launcher]
background                = "#ffffff"
background-alpha          = 0.78
text                      = "#1c1c1e"
border                    = "#000000"
border-alpha              = 0.10
scrim                     = "#000000"
scrim-alpha               = 0.25
selected-background       = "#007aff"
selected-background-alpha = 0.95
selected-text             = "#ffffff"
selected-border           = "#007aff"
selected-border-alpha     = 0.0

[menu]
background                = "#ffffff"
background-alpha          = 0.8
text                      = "#1c1c1e"
border                    = "#000000"
border-alpha              = 0.10
scrim                     = "#000000"
scrim-alpha               = 0.25
selected-background       = "#007aff"
selected-background-alpha = 0.95
selected-text             = "#ffffff"
selected-border           = "#007aff"
selected-border-alpha     = 0.0

[polkit]
background       = "#ffffff"
background-alpha = 0.92
text             = "#1c1c1e"
text-error       = "#d70015"
border           = "#000000"
border-alpha     = 0.10
border-error     = "#d70015"
scrim            = "#000000"
scrim-alpha      = 0.3
accent           = "#007aff"

[lock]
background       = "#ffffff"
background-alpha = 0.6
text             = "#1c1c1e"
placeholder      = "#8e8e93"
text-error       = "#d70015"
border           = "#000000"
border-active    = "#007aff"
border-error     = "#d70015"
border-alpha     = 0.16
selection        = "#007aff"
selection-alpha  = 0.35

[image-picker]
scrim                   = "#000000"
scrim-alpha             = 0.3
text                    = "#1c1c1e"
selected-border         = "#007aff"
selected-border-alpha   = 1.0
unselected-border       = "#1c1c1e"
unselected-border-alpha = 0.22
