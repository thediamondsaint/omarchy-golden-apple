# iOS Light — Apple's system colors, light mode.
# The light ramps are tuned for white surfaces: systemYellow and systemGreen are
# taken a shade down from their iOS values so text sits readably on #f2f2f7.
mode = "light"

accent = "#007aff"            # systemBlue (light)
selection = "#b3d7ff"         # systemBlue at 30% over white, as iOS selects text
muted = "#aeaeb2"             # systemGray3 — terminal "bright black"

background = "#f2f2f7"        # systemGroupedBackground
dark_background = "#e5e5ea"   # systemGray5 — bar, recessed surfaces
darker_background = "#d1d1d6" # systemGray4
lighter_background = "#ffffff" # elevated cards

foreground = "#1c1c1e"         # label
dark_foreground = "#8e8e93"    # systemGray — tertiary text
light_foreground = "#3a3a3c"   # secondaryLabel
bright_foreground = "#000000"

red = "#d70015"                # systemRed, darkened for white
yellow = "#b25000"             # systemYellow is unreadable on white; amber instead
orange = "#c93400"             # systemOrange, darkened
green = "#248a3d"              # systemGreen, darkened
cyan = "#0071a4"               # systemCyan, darkened
blue = "#007aff"               # systemBlue
magenta = "#8944ab"            # systemPurple, darkened
brown = "#7f6545"              # systemBrown, darkened

bright_red = "#ff3b30"
bright_yellow = "#c77700"
bright_green = "#34c759"
bright_cyan = "#5ac8fa"
bright_blue = "#0a84ff"
bright_magenta = "#af52de"
