# Golden Apple Light — foot colours, and the terminal's own glass.
#
# This replaces the foot.ini Omarchy generates from colors.toml for one reason:
# `alpha`. A window that a Hyprland rule merely fades is still an opaque surface
# drawn at lower opacity — text fades with it. `alpha` makes the terminal draw its
# *background* transparent and leaves the text fully opaque, which is both prettier
# and far more readable over a photograph.
#
# alpha has to sit inside the same section as the colours ([colors-dark], which is
# what Omarchy's own template uses); in a plain [colors] section foot ignores it.
# Raise it towards 1.0 for a more solid terminal.

[colors-dark]
alpha=0.90

foreground=2a2318
background=faf6ec
selection-foreground=2a2318
selection-background=f0e0b8

cursor=faf6ec 1a1610

regular0=faf6ec
regular1=b23a2e
regular2=4e7a2e
regular3=8e6a12
regular4=3a6b99
regular5=8a4e86
regular6=2c7a70
regular7=2a2318

bright0=b9a67c
bright1=d1503f
bright2=628f3a
bright3=a87a1f
bright4=4b81b3
bright5=a3639e
bright6=3a938a
bright7=1a1610
